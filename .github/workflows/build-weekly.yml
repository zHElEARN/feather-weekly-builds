name: Build Feather (Weekly)

on:
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this commit was already built
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

concurrency:
  group: build-feather-weekly
  cancel-in-progress: false

env:
  UPSTREAM: claration/feather
  APP_NAME: Feather.ipa
  EXPECTED_BUNDLE_ID: thewonderofyou.Feather

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Resolve upstream main
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(gh api "repos/${UPSTREAM}/commits/main" --jq '.sha')"
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${UPSTREAM}@main: ${SHA}"

      - name: Check whether this commit was already built
        id: check
        run: |
          SHA="${{ steps.upstream.outputs.sha }}"
          FORCE="${{ github.event.inputs.force == 'true' }}"
          LAST="$(cat last-built-sha 2>/dev/null || true)"
          if [ "${FORCE}" = "true" ] || [ "${LAST}" != "${SHA}" ]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "Building ${SHA} (last built: ${LAST:-none})"
          else
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "Already built: ${SHA}"
          fi

      - name: Checkout upstream source
        if: steps.check.outputs.build == 'true'
        uses: actions/checkout@v7
        with:
          repository: claration/feather
          ref: ${{ steps.upstream.outputs.sha }}
          path: src
          fetch-depth: 1
          submodules: recursive

      - name: Build
        if: steps.check.outputs.build == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          cd src
          make iphoneos
          cp packages/Feather.ipa "../dist/${APP_NAME}"

      - name: Verify IPA
        id: verify
        if: steps.check.outputs.build == 'true'
        run: |
          set -euo pipefail
          IPA="dist/${APP_NAME}"
          test -s "${IPA}"

          WORK="$(mktemp -d)"
          trap 'rm -rf "${WORK}"' EXIT
          unzip -p "${IPA}" 'Payload/*.app/Info.plist' > "${WORK}/Info.plist"

          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw -o - "${WORK}/Info.plist")"
          VERSION="$(plutil -extract CFBundleShortVersionString raw -o - "${WORK}/Info.plist")"
          BUILD="$(plutil -extract CFBundleVersion raw -o - "${WORK}/Info.plist")"

          test "${BUNDLE_ID}" = "${EXPECTED_BUNDLE_ID}"
          test -n "${VERSION}"
          test -n "${BUILD}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "size=$(stat -f%z "${IPA}")" >> "${GITHUB_OUTPUT}"
          echo "Verified ${BUNDLE_ID} / ${VERSION} (${BUILD})"

      - name: Create release
        id: release
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.upstream.outputs.sha }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail
          TAG="weekly-$(date -u +%Y.%m.%d)"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
          fi
          gh release create "${TAG}" "dist/${APP_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target main \
            --title "Feather ${VERSION} (weekly $(date -u +%Y.%m.%d))" \
            --notes "Weekly build of Feather main.
          Upstream commit: ${SHA}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Update source
        if: steps.check.outputs.build == 'true'
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version }}
          SIZE: ${{ steps.verify.outputs.size }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APP_NAME}"
          jq --arg version "${VERSION}" --arg date "${DATE}" --arg url "${URL}" --argjson size "${SIZE}" '
            .apps[0].version = $version
            | .apps[0].versionDate = $date
            | .apps[0].downloadURL = $url
            | .apps[0].size = $size
            | .apps[0].versions = [
                {version: $version, date: $date, downloadURL: $url, size: $size}
              ]
          ' app-repo.json > app-repo.json.tmp
          mv app-repo.json.tmp app-repo.json
          jq empty app-repo.json

      - name: Prune old releases
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName \
            --jq '.[] | select(.tagName | startswith("weekly-")) | .tagName' \
            | tail -n +4 \
            | while read -r TAG; do
                [ -n "${TAG}" ] || continue
                gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
              done

      - name: Commit state and source
        if: steps.check.outputs.build == 'true'
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          echo "${SHA}" > last-built-sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-repo.json last-built-sha
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: build Feather weekly $(date -u +%Y.%m.%d) (${SHA:0:7})"
            git push origin HEAD:main
          fi
